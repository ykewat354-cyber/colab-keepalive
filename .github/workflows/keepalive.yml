name: MC Panel Keepalive (24/7 monitor)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Colab Panel
        env:
          PANEL: ${{ secrets.COLAB_URL }}
        run: |
          echo "⏰ Ping at $(date -u)"
          if [ -z "$PANEL" ]; then
            echo "⚠️ COLAB_URL secret set nahi hai — skip"
            exit 0
          fi
          CODE=$(curl -s -o /tmp/status.json -w "%{http_code}" -m 25 \
            -H "ngrok-skip-browser-warning: true" "$PANEL/api/status" || echo "000")
          echo "📊 HTTP: $CODE"
          BODY=$(head -c 300 /tmp/status.json 2>/dev/null || echo "")
          echo "📦 Response: $BODY"
          if [ "$CODE" = "200" ] && echo "$BODY" | grep -q '"running"'; then
            echo "🟢 Panel LIVE — server status: $BODY"
          else
            echo "🔴 Panel reachable nahi (session band ho gaya ho sakta hai)"
          fi
          echo "💓 Keep-alive cycle complete"
